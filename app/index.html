<style>

  body{padding:max(16px,env(safe-area-inset-top)) 16px 60px;}
  .wrap{max-width:1080px;margin:0 auto;}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .logo{font-size:20px;font-weight:800;letter-spacing:-.02em;} .logo b{color:var(--accent);}
  .tools{display:flex;gap:6px;align-items:center;}
  .tbtn{font-size:13px;text-decoration:none;display:inline-block;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;}

  .prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;flex:1;}
  .chip{font-size:13px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;transition:.12s;}
  .chip.on{color:var(--bg);background:var(--ink);border-color:var(--ink);}
  .ssel{font-size:13px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;outline:none;}

  .dcaslider{width:100%;margin-top:10px;accent-color:var(--accent);}
  .dcaval{font-size:16px;font-weight:800;color:var(--ink);margin-top:8px;}
  .dcaout{background:var(--soft);border-radius:14px;padding:14px 16px;margin-top:14px;}
  .dcarow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:14px;color:var(--muted);}
  .dcarow b{color:var(--ink);font-weight:800;}

  .pbtn{font-size:13px;font-weight:700;color:var(--accent);background:var(--card);border:1px solid var(--accent);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;}
  .pbanner{display:none;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:10px 14px;margin:12px 0 0;font-size:13px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:.14s;}
  .card:hover{border-color:var(--faint);transform:translateY(-2px);box-shadow:0 10px 26px var(--shadow);}
  .c-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .rank{font-size:11px;font-weight:700;color:var(--faint);} .tkr{font-size:15px;font-weight:800;}
  .badge{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;}

  .bar{height:6px;background:var(--soft);border-radius:6px;margin:12px 0 8px;overflow:hidden;} .bar i{display:block;height:100%;border-radius:6px;}
  .risk{font-size:12.5px;color:var(--muted);}
  .c-bot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);}
  .px{font-size:13px;font-weight:700;} .chg{font-size:12px;font-weight:700;} .chg.up{color:var(--buy);} .chg.dn{color:var(--avoid);}
  .ov{position:fixed;inset:0;background:rgba(10,12,18,.5);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .ov.on{display:flex;} @media(min-width:640px){.ov{align-items:center;padding:20px;}}
  .sheet{background:var(--card);width:100%;max-width:540px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));}

  .m-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .m-tkr{font-size:22px;font-weight:800;} .m-nm{font-size:14px;color:var(--muted);margin-top:2px;}
  .x{font-size:18px;color:var(--muted);background:var(--soft);border:0;border-radius:10px;width:34px;height:34px;flex:none;cursor:pointer;}
  .m-badge{font-size:15px;font-weight:800;border-radius:999px;padding:8px 16px;display:inline-block;margin:14px 0 4px;}
  .block{border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:10px;}
  .block .k{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);}
  .block .v{font-size:14.5px;margin-top:5px;} .foryou{color:var(--accent);font-weight:600;margin-top:6px;font-size:13.5px;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
  .stat{background:var(--soft);border-radius:12px;padding:10px;text-align:center;}
  .stat .sv{font-size:17px;font-weight:800;} .stat .sk{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .m-disc{font-size:11.5px;color:var(--faint);margin-top:14px;text-align:center;line-height:1.5;}
  .foot{margin-top:30px;text-align:center;font-size:11.5px;color:var(--faint);line-height:1.7;} .foot b{color:var(--muted);}
  .empty,.err{grid-column:1/-1;text-align:center;color:var(--faint);padding:40px 0;font-size:14px;}
  /* quiz */
  .q{margin-top:6px;} .q h4{font-size:14px;font-weight:700;margin:16px 0 8px;}
  .qopts{display:flex;flex-direction:column;gap:6px;}

  .qopt.on{border-color:var(--accent);color:var(--ink);background:var(--soft);font-weight:600;}
  .qgo{width:100%;margin-top:18px;font-size:15px;font-weight:800;color:var(--bg);background:var(--accent);border:0;border-radius:999px;padding:12px;cursor:pointer;}
  .qgo:disabled{opacity:.4;}
</style>

     meta:(d,u,n)=>`Data ${d} · from ${u} · ${n} stocks`,
     f:{ALL:"All",BUY:"✅ Worth a look",WAIT:"🟡 Wait",AVOID:"🔴 Not now"}, allSectors:"All sectors",
     dca:{title:"DCA calculator",intro:"Invest the same amount every month for years — how much could you get?",perMonth:"Invest per month",perMoUnit:"/mo",years:"For",yrUnit:"years",ret:"Assumed return per year",retUnit:"/yr",invested:"Total you put in",final:"Estimated value",gain:"Gain (approx.)",caveat:"This assumes a return — it's not a guarantee · real results go up and down · past is not future"},
     v:{BUY:"Worth a look",WAIT:"Wait",AVOID:"Not now"},
     riskCard:(r,w)=>`risk <b>${r}%</b> · max ฿${w}/100`, empty:"No stocks in this group",
     dRisk:"Risk (in baht)",dWhy:"Why",dTrust:"How much to trust",sScore:"Rank",sWin:"Past up-rate",sLast:"Last price",
     riskS:(r,w)=>`A normal-bad month could drop ~<b>${r}%</b> · so put at most <b>฿${w}</b> of every 100`,
     bPfx:"Because ",bJoin:" and ", trust:p=>p==null?`Not yet measured — no confidence figure is shown`:`Stocks scoring like this rose the next month <b>${p}%</b> of the time — measured over 84 months, and <b>the same across almost every score band</b>. So the score <b>does not predict direction</b>: treat it as a shortlist to research, not a forecast.`,
     forYou:(l,w)=>`For you (${l}): put at most <b>฿${w}</b> per 100`,
     pbtn:"Personalize", banner:l=>`Ranked & sized to your risk comfort · <b>${l}</b>`, redo:"Redo", clear:"Clear",
     disc:'SETScout points you to “research,” it does not tell you to buy/sell',
     foot:'<b>SETScout</b> · Explainable Investment Decision Support · SET100<br>For education & research only · not a buy/sell recommendation · past performance ≠ future results · consult a licensed adviser<br><a href="legal.html" style="color:var(--muted)">Terms &amp; Privacy</a> · <a href="onboard.html" style="color:var(--muted)">How it works</a>',
     pTitle:"Personalize to you", pSub:"5 quick questions — we rank & size the list to the risk you can handle.", see:"See results",
     prof:{cons:"Conservative",bal:"Balanced",agg:"Aggressive"},
     method:{title:"How we score",intro:"Every stock is scored on 5 factors (from 2 years of real prices)",
       factors:[["📈","Momentum","6-month return — is the price doing well?"],["🌱","Growth","12-month return — the longer trend"],["⚖️","Price vs its own average","below its 200-day average = room to bounce (mean-reversion)"],["🛡️","Quality","low volatility — calm, not wild"],["❤️","Health","small max-drawdown — survives bad markets"]],
       wLabel:"Weighting",weights:"Quality 28% · Price-vs-avg 24% · Momentum 20% · Health 16% · Growth 12%",wNote:"Weights change with your risk profile — take the quiz to switch.",
       vLabel:"How the verdict is decided",verdict:"Top 20% of the market → Worth a look ✅ · 45–80th percentile → Wait 🟡 · below 45th → Not now 🔴",
       rLabel:"Risk",risk:"From monthly VaR (how bad a bad month could be), converted to the max position size we suggest",
       cLabel:"⚠️ Honest notes",caveats:["Weights are preliminary — pending the AHP expert survey","Not yet backtested","Factors are price proxies — v2 adds fundamentals (P/E, ROE)","Educational, not investment advice"]},
     quiz:[
      ["A stock you own drops 20% in a month, you:",[["Buy more",2],["Hold",1],["Sell some",0],["Sell all",-1]]],
      ["When do you need this money:",[["Within 1 yr",-1],["1–5 yrs",1],["5+ yrs",2]]],
      ["What matters more:",[["Protect capital",-1],["Balanced",1],["Grow fast",2]]],
      ["Experience:",[["Beginner",-1],["Some",1],["Experienced",2]]],
      ["Max % of savings in stocks:",[["Under 10%",-1],["10–30%",1],["Over 30%",2]]],
     ] },
  };

  let lang = localStorage.getItem('ss_lang')||'th';
  let theme = localStorage.getItem('ss_theme')||'light';
  let risk = null; try{risk=JSON.parse(localStorage.getItem('ss_risk'))}catch{}
  let filter='ALL', sector='ALL', DATA=null;
  const tr=()=>T[lang];

  function applyTheme(){ document.documentElement.setAttribute('data-theme',theme); $('#themeBtn').textContent=theme==='light'?'🌙':'☀️'; }
  function paintStatic(){
    document.documentElement.lang=lang;
    $('#langBtn').textContent=tr().lang; $('#pill').textContent=tr().pill; $('#methodBtn').textContent='ⓘ '+tr().method.title;
    $('#h1').textContent=tr().title; $('#sub').innerHTML=tr().sub; $('#pbtn').textContent=tr().pbtn; $('#foot').innerHTML=tr().foot;
    if(DATA) $('#meta').textContent=tr().meta(DATA.generated,DATA.universe,DATA.stocks.length);
    $('#filters').innerHTML=['ALL','BUY','WAIT','AVOID'].map(k=>`<button class="chip${k===filter?' on':''}" data-f="${k}">${tr().f[k]}</button>`).join('');
    populateSectors();
  }
  const vcls={BUY:'buy',WAIT:'wait',AVOID:'avoid'}, vemo={BUY:'✅',WAIT:'🟡',AVOID:'🔴'};
  const col={buy:'var(--buy)',wait:'var(--wait)',avoid:'var(--avoid)'}, bgc={buy:'var(--buyb)',wait:'var(--waitb)',avoid:'var(--avoidb)'};
  const pweight=s=>{ let w=s.max_weight*(risk?PROFILES[risk.key].sizeMult:1); return Math.round(Math.max(0.05,Math.min(0.6,w))*100); };
  // personalization = serve the matching risk-profile engine's OWN ranked list
  const PMAP={cons:'conservative',bal:'balanced',agg:'aggressive'};
  const activeList=()=> (risk && DATA && DATA.profiles && DATA.profiles[PMAP[risk.key]]) ? DATA.profiles[PMAP[risk.key]] : (DATA?DATA.stocks:[]);
  // "How we score" reads the ACTIVE profile's weights from today.json (single source of truth)
  const FLABEL={th:{quality:"คุณภาพ",value:"ราคาเทียบค่าเฉลี่ย",momentum:"โมเมนตัม",health:"สุขภาพ",growth:"เติบโต"},
               en:{quality:"Quality",value:"Price-vs-avg",momentum:"Momentum",health:"Health",growth:"Growth"}};
  const profName=()=> risk?tr().prof[risk.key]:tr().prof.bal;
  function weightsStr(){
    const w=DATA&&DATA.profile_weights&&DATA.profile_weights[risk?PMAP[risk.key]:'balanced'];
    if(!w) return tr().method.weights;
    return Object.entries(w).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${FLABEL[lang][k]} ${Math.round(v*100)}%`).join(' · ');
  }

  function populateSectors(){
    if(!DATA)return;
    const secs=[...new Set(DATA.stocks.map(s=>s.sector))].sort();
    $('#sectorSel').innerHTML=`<option value="ALL">${tr().allSectors}</option>`+secs.map(s=>`<option value="${s}">${s}</option>`).join('');
    $('#sectorSel').value=sector;
  }
  function render(){
    if(!DATA)return;
    let list=activeList().filter(s=>(filter==='ALL'||s.verdict===filter)&&(sector==='ALL'||s.sector===sector)).sort((a,b)=>b.score-a.score);
    // personalization banner
    const pb=$('#pbanner');
    if(risk){ pb.classList.add('on'); pb.innerHTML=`<span>${tr().banner(tr().prof[risk.key])}</span><span><a id="redoQ">${tr().redo}</a><a id="clrQ">${tr().clear}</a></span>`;
      $('#redoQ').onclick=openQuiz; $('#clrQ').onclick=()=>{risk=null;localStorage.removeItem('ss_risk');render();}; }
    else pb.classList.remove('on');
    if(!list.length){ $('#grid').innerHTML=`<div class="empty">${tr().empty}</div>`; return; }
    $('#grid').innerHTML=list.map((s,i)=>{const c=vcls[s.verdict],up=s.chg_pct>=0;
      return `<div class="card" data-t="${s.ticker}"><div class="c-top"><div><span class="rank">#${i+1}</span> <span class="tkr">${s.ticker.replace('.BK','')}</span></div>
        <span class="badge ${c}">${vemo[s.verdict]} ${tr().v[s.verdict]}</span></div>
        <div class="nm">${s.name_th} <span class="nm-en">· ${s.sector}</span></div>
        <div class="bar"><i style="width:${Math.round(s.score*100)}%;background:${col[c]}"></i></div>
        <div class="risk">${tr().riskCard(Math.abs(s.risk_month_pct),pweight(s))}</div>
        <div class="c-bot"><span class="px">฿${s.last.toLocaleString(undefined,{minimumFractionDigits:2})}</span>
        <span class="chg ${up?'up':'dn'}">${up?'▲':'▼'} ${Math.abs(s.chg_pct).toFixed(1)}%</span></div></div>`;
    }).join('');
  }
  const becauseS=s=>tr().bPfx+s.because.map(c=>REASON[c][lang]).join(tr().bJoin);
  function openSheet(t){const s=activeList().find(x=>x.ticker===t),c=vcls[s.verdict];
    $('#sheet').innerHTML=`<div class="m-top"><div><div class="m-tkr">${s.ticker.replace('.BK','')}</div><div class="m-nm">${s.name_th} · ${s.name} · ${s.sector}</div></div><button class="x" id="xb">✕</button></div>
      <div class="m-badge" style="color:${col[c]};background:${bgc[c]}">${vemo[s.verdict]} ${tr().v[s.verdict]}</div>
      <div class="block"><div class="k">${tr().dRisk}</div><div class="v">${tr().riskS(Math.abs(s.risk_month_pct),pweight(s))}</div>${risk?`<div class="foryou">${tr().forYou(tr().prof[risk.key],pweight(s))}</div>`:''}</div>
      <div class="block"><div class="k">${tr().dWhy}</div><div class="v">${becauseS(s)}</div></div>
      <div class="block"><div class="k">${tr().dTrust}</div><div class="v">${tr().trust(s.p_win==null?null:Math.round(s.p_win*100))}</div></div>
      <div class="stats"><div class="stat"><div class="sv">#${activeList().findIndex(x=>x.ticker===s.ticker)+1}</div><div class="sk">${tr().sScore}</div></div>
        <div class="stat"><div class="sv">${s.p_win==null?"—":Math.round(s.p_win*100)+"%"}</div><div class="sk">${tr().sWin}</div></div>
        <div class="stat"><div class="sv">฿${s.last.toLocaleString()}</div><div class="sk">${tr().sLast}</div></div></div>
      <div class="m-disc">${DATA.disclaimer}<br>${tr().disc}</div>`;
    $('#ov').classList.add('on');document.body.style.overflow='hidden';$('#xb').onclick=close;
  }
  function close(){$('#ov').classList.remove('on');document.body.style.overflow='';}

  // quiz
  function openQuiz(){
    const ans=new Array(tr().quiz.length).fill(null);
    $('#sheet').innerHTML=`<div class="m-top"><div><div class="m-tkr" style="font-size:19px">${tr().pTitle}</div><div class="m-nm">${tr().pSub}</div></div><button class="x" id="xb">✕</button></div>
      <div class="q" id="qbody">${tr().quiz.map((q,qi)=>`<h4>${qi+1}. ${q[0]}</h4><div class="qopts">${q[1].map((o,oi)=>`<div class="qopt" data-q="${qi}" data-o="${oi}" data-p="${o[1]}">${o[0]}</div>`).join('')}</div>`).join('')}
      <button class="qgo" id="qgo" disabled>${tr().see}</button></div>`;
    $('#ov').classList.add('on');document.body.style.overflow='hidden';$('#xb').onclick=close;
    $('#qbody').addEventListener('click',e=>{const o=e.target.closest('.qopt');if(!o)return;const qi=+o.dataset.q;
      document.querySelectorAll(`.qopt[data-q="${qi}"]`).forEach(x=>x.classList.remove('on'));o.classList.add('on');ans[qi]=+o.dataset.p;
      $('#qgo').disabled=ans.includes(null);});
    $('#qgo').onclick=()=>{const sum=ans.reduce((a,b)=>a+b,0);const key=sum<=2?'cons':sum>=7?'agg':'bal';
      risk={key,sum};localStorage.setItem('ss_risk',JSON.stringify(risk));close();render();};
  }

  function openMethod(){
    const m=tr().method;
    $('#sheet').innerHTML=`<div class="m-top"><div><div class="m-tkr" style="font-size:19px">ⓘ ${m.title}</div><div class="m-nm">${m.intro}</div></div><button class="x" id="xb">✕</button></div>
      ${m.factors.map(f=>`<div class="block"><div class="v"><b>${f[0]} ${f[1]}</b> — <span style="color:var(--muted)">${f[2]}</span></div></div>`).join('')}
      <div class="block"><div class="k">${m.wLabel} — ${profName()}</div><div class="v">${weightsStr()}</div><div style="font-size:12px;color:var(--muted);margin-top:6px">${m.wNote}</div></div>
      <div class="block"><div class="k">${m.vLabel}</div><div class="v">${m.verdict}</div></div>
      <div class="block"><div class="k">${m.rLabel}</div><div class="v">${m.risk}</div></div>
      <div class="block" style="border-left:3px solid var(--wait)"><div class="k" style="color:var(--wait)">${m.cLabel}</div><div class="v" style="font-size:13px;color:var(--muted)">${m.caveats.map(c=>'• '+c).join('<br>')}</div></div>`;
    $('#ov').classList.add('on');document.body.style.overflow='hidden';$('#xb').onclick=close;
  }

  function openDCA(){
    const d=tr().dca;
    $('#sheet').innerHTML=`<div class="m-top"><div><div class="m-tkr" style="font-size:19px">💰 ${d.title}</div><div class="m-nm">${d.intro}</div></div><button class="x" id="xb">✕</button></div>
      <div class="block"><div class="k">${d.perMonth}</div><input type="range" id="dcaAmt" min="500" max="50000" step="500" value="3000" class="dcaslider"><div class="dcaval" id="dcaAmtV"></div></div>
      <div class="block"><div class="k">${d.years}</div><input type="range" id="dcaYr" min="1" max="30" step="1" value="10" class="dcaslider"><div class="dcaval" id="dcaYrV"></div></div>
      <div class="block"><div class="k">${d.ret}</div><input type="range" id="dcaRet" min="0" max="15" step="0.5" value="6" class="dcaslider"><div class="dcaval" id="dcaRetV"></div></div>
      <div class="dcaout" id="dcaOut"></div>
      <div class="block" style="border-left:3px solid var(--wait)"><div class="v" style="font-size:12.5px;color:var(--muted)">⚠️ ${d.caveat}</div></div>`;
    $('#ov').classList.add('on');document.body.style.overflow='hidden';$('#xb').onclick=close;
    const calc=()=>{
      const amt=+$('#dcaAmt').value, yr=+$('#dcaYr').value, ret=+$('#dcaRet').value;
      $('#dcaAmtV').textContent='฿'+amt.toLocaleString()+' '+d.perMoUnit;
      $('#dcaYrV').textContent=yr+' '+d.yrUnit;
      $('#dcaRetV').textContent=ret+'% '+d.retUnit;
      const n=yr*12, r=ret/100/12, fv=r>0?amt*((Math.pow(1+r,n)-1)/r):amt*n, inv=amt*n, gain=fv-inv;
      $('#dcaOut').innerHTML=`<div class="dcarow"><span>${d.invested}</span><b>฿${Math.round(inv).toLocaleString()}</b></div>
        <div class="dcarow big"><span>${d.final}</span><b style="color:var(--buy)">฿${Math.round(fv).toLocaleString()}</b></div>
        <div class="dcarow"><span>${d.gain}</span><b style="color:${gain>=0?'var(--buy)':'var(--avoid)'}">${gain>=0?'+':''}฿${Math.round(gain).toLocaleString()}</b></div>`;
    };
    ['dcaAmt','dcaYr','dcaRet'].forEach(id=>$('#'+id).addEventListener('input',calc));
    calc();
  }

  // events
  $('#themeBtn').onclick=()=>{theme=theme==='light'?'dark':'light';localStorage.setItem('ss_theme',theme);applyTheme();};
  $('#langBtn').onclick=()=>{lang=lang==='th'?'en':'th';localStorage.setItem('ss_lang',lang);paintStatic();render();};
  $('#filters').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;filter=b.dataset.f;paintStatic();render();});
  $('#sectorSel').addEventListener('change',e=>{sector=e.target.value;render();});
  $('#pbtn').onclick=openQuiz;
  $('#methodBtn').onclick=openMethod;
  $('#dcaBtn').onclick=openDCA;
  $('#grid').addEventListener('click',e=>{const c=e.target.closest('[data-t]');if(c)openSheet(c.dataset.t);});
  $('#ov').addEventListener('click',e=>{if(e.target===$('#ov'))close();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});

  applyTheme(); paintStatic();
  fetch('today.json?v='+Date.now()).then(r=>r.json()).then(d=>{DATA=d;paintStatic();populateSectors();render();})
    .catch(()=>{$('#grid').innerHTML='<div class="err">Could not load today.json — open via the hosted link.</div>';});
})();
</script>
</body>
</html>
